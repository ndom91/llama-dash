# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json
#
# Copy this to config.yaml and edit to match your setup.
# llama-swap watches this file and reloads automatically (-watch-config).
#
# Models are stored in /models inside the container.
# Use ${PORT} — llama-swap replaces it with an assigned port.

# Defaults that suit running behind llama-dash:
# - llama-dash captures request/response bodies itself, so llama-swap's own
#   capture buffer would only keep a second copy of every prompt.
# - The Help page and its /api/mcp endpoint (docs and source-code tools) are
#   not used by llama-dash.
# Keep `performance` enabled: llama-dash's System page reads /api/performance.
captureBuffer: 0
# Keep wall-clock timestamps in llama-swap's own log history for the Logs viewer.
# Raw model output is unchanged; llama.cpp uptime is not wall-clock time.
logTimeFormat: rfc3339nano
helpagent:
  disable: true

models:
  llama3:
    # Bind model servers to localhost so only llama-swap can reach them;
    # 0.0.0.0 exposes every model port without llama-swap/llama-dash auth.
    cmd: llama-server --host 127.0.0.1 --port ${PORT} --model /models/llama-3.gguf
    ttl: 300

  # More full featured usage example
  # "gemma-4-26B-A4B-it":
  #   name: Gemma-4 26B-A4B Instruct
  #   cmd: |
  #     llama-server
  #       --model /models/unsloth/gemma4/26B-A4B-it/gemma-4-26B-A4B-it-UD-Q8_K_XL.gguf
  #       --mmproj /models/unsloth/gemma4/26B-A4B-it/mmproj-BF16.gguf
  #       -ngl 99
  #       --temp 1.0
  #       --top-p 0.95
  #       --top-k 64
  #       --ctx-size 16384
  #       --reasoning off
  #       --parallel 1
  #       --host 127.0.0.1
  #       --port ${PORT}
